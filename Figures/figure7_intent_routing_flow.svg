<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Figure 7 — Intent Routing Flow</title>
  <desc>Decision tree showing how a user query passes through safety guards and service detection before being routed to one of six specialist workflows or the RAG pipeline.</desc>

  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Figure 7 — Intent Routing Flow</text>

  <defs>
    <marker id="ia" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="iy" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="in" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <rect x="310" y="42" width="180" height="42" rx="6" fill="#e8f4fd" stroke="#5a9fd4" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a4a6b">User Query Received</text>
  <text x="400" y="74" text-anchor="middle" font-size="8.5" fill="#3a6a8b">Session ID · message text</text>

  <line x1="400" y1="84" x2="400" y2="105" stroke="#555" stroke-width="1.4" marker-end="url(#ia)"/>

  <polygon points="400,105 480,130 400,155 320,130" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="400" y="127" text-anchor="middle" font-size="9" font-weight="700" fill="#7b1a1a">Safety &amp;</text>
  <text x="400" y="141" text-anchor="middle" font-size="9" font-weight="700" fill="#7b1a1a">Scope guards</text>

  <line x1="480" y1="130" x2="570" y2="130" stroke="#e74c3c" stroke-width="1.4" marker-end="url(#in)"/>
  <text x="522" y="124" text-anchor="middle" font-size="8" fill="#e74c3c">unsafe / out-of-scope</text>
  <rect x="570" y="112" width="115" height="36" rx="5" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="627" y="128" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7b1a1a">Refusal / Redirect</text>
  <text x="627" y="141" text-anchor="middle" font-size="7.5" fill="#a03030">IsUnsafe · IsOutOfScope</text>

  <line x1="400" y1="155" x2="400" y2="178" stroke="#555" stroke-width="1.4" marker-end="url(#ia)"/>
  <text x="362" y="170" font-size="8" fill="#27ae60">passes</text>

  <polygon points="400,178 480,203 400,228 320,203" fill="#fff0e6" stroke="#e07030" stroke-width="1.5"/>
  <text x="400" y="200" text-anchor="middle" font-size="9" font-weight="700" fill="#5a2800">Small talk /</text>
  <text x="400" y="214" text-anchor="middle" font-size="9" font-weight="700" fill="#5a2800">Crisis / Vague</text>

  <line x1="480" y1="203" x2="570" y2="203" stroke="#e07030" stroke-width="1.4" marker-end="url(#ia)"/>
  <text x="522" y="197" text-anchor="middle" font-size="8" fill="#e07030">matched</text>
  <rect x="570" y="185" width="115" height="36" rx="5" fill="#fff0e6" stroke="#e07030" stroke-width="1.2"/>
  <text x="627" y="201" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5a2800">Direct Reply</text>
  <text x="627" y="214" text-anchor="middle" font-size="7.5" fill="#7a4010">SmallTalk · Crisis · Vague</text>

  <line x1="400" y1="228" x2="400" y2="252" stroke="#555" stroke-width="1.4" marker-end="url(#ia)"/>
  <text x="362" y="244" font-size="8" fill="#27ae60">passes</text>

  <rect x="310" y="252" width="180" height="40" rx="6" fill="#e9f5e9" stroke="#4caf76" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#1b4d2e">Detect Service</text>
  <text x="400" y="284" text-anchor="middle" font-size="8.5" fill="#2a6a40">Keyword scoring · lastService context</text>

  <line x1="400" y1="292" x2="400" y2="314" stroke="#555" stroke-width="1.4" marker-end="url(#ia)"/>

  <polygon points="400,314 490,344 400,374 310,344" fill="#fef9e7" stroke="#e2a800" stroke-width="1.5"/>
  <text x="400" y="340" text-anchor="middle" font-size="9" font-weight="700" fill="#5a3e00">Select</text>
  <text x="400" y="354" text-anchor="middle" font-size="9" font-weight="700" fill="#5a3e00">Handler</text>

  <!-- Branch 1: RAG -->
  <line x1="310" y1="344" x2="50" y2="344" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <line x1="50" y1="344" x2="50" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="10" y="420" width="82" height="50" rx="5" fill="#f3e8ff" stroke="#9b59b6" stroke-width="1.2"/>
  <text x="51" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#4a1870">RAG Pipeline</text>
  <text x="51" y="453" text-anchor="middle" font-size="7.5" fill="#6a3090">General council</text>
  <text x="51" y="464" text-anchor="middle" font-size="7.5" fill="#6a3090">queries</text>

  <!-- Branch 2: Bin collection -->
  <line x1="340" y1="374" x2="200" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="155" y="420" width="92" height="50" rx="5" fill="#e9f5e9" stroke="#4caf76" stroke-width="1.2"/>
  <text x="201" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1b4d2e">Bin / Waste</text>
  <text x="201" y="453" text-anchor="middle" font-size="7.5" fill="#2a6a40">Playwright</text>
  <text x="201" y="464" text-anchor="middle" font-size="7.5" fill="#2a6a40">live scraper</text>

  <!-- Branch 3: Housing -->
  <line x1="370" y1="374" x2="340" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="297" y="420" width="88" height="50" rx="5" fill="#e8f4fd" stroke="#5a9fd4" stroke-width="1.2"/>
  <text x="341" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1a4a6b">Housing</text>
  <text x="341" y="453" text-anchor="middle" font-size="7.5" fill="#3a6a8b">Emergency /</text>
  <text x="341" y="464" text-anchor="middle" font-size="7.5" fill="#3a6a8b">Register flow</text>

  <!-- Branch 4: School Finder -->
  <line x1="430" y1="374" x2="460" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="415" y="420" width="92" height="50" rx="5" fill="#fef9e7" stroke="#e2a800" stroke-width="1.2"/>
  <text x="461" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5a3e00">School Finder</text>
  <text x="461" y="453" text-anchor="middle" font-size="7.5" fill="#7a5800">Nearby schools</text>
  <text x="461" y="464" text-anchor="middle" font-size="7.5" fill="#7a5800">OS Places API</text>

  <!-- Branch 5: Nearby Services -->
  <line x1="460" y1="374" x2="590" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="545" y="420" width="92" height="50" rx="5" fill="#fff0e6" stroke="#e07030" stroke-width="1.2"/>
  <text x="591" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5a2800">Nearby Services</text>
  <text x="591" y="453" text-anchor="middle" font-size="7.5" fill="#7a4010">Libraries · Parks</text>
  <text x="591" y="464" text-anchor="middle" font-size="7.5" fill="#7a4010">OS Places API</text>

  <!-- Branch 6: Appointment / Forms -->
  <line x1="490" y1="344" x2="720" y2="344" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <line x1="720" y1="344" x2="720" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ia)"/>
  <rect x="676" y="420" width="88" height="50" rx="5" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="720" y="440" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7b1a1a">Appt / Forms</text>
  <text x="720" y="453" text-anchor="middle" font-size="7.5" fill="#a03030">Booking links</text>
  <text x="720" y="464" text-anchor="middle" font-size="7.5" fill="#a03030">Pending flow</text>

  <text x="218" y="340" font-size="7.5" fill="#555">Bins</text>
  <text x="358" y="392" font-size="7.5" fill="#555">Housing</text>
  <text x="432" y="392" font-size="7.5" fill="#555">School</text>
  <text x="518" y="340" font-size="7.5" fill="#555">Appt</text>
  <text x="555" y="390" font-size="7.5" fill="#555">Nearby</text>
  <text x="140" y="338" font-size="7.5" fill="#555">General / Council Tax etc.</text>
</svg>
