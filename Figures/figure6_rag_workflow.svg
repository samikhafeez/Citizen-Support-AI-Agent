<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Figure 6 — Retrieval-Augmented Generation Workflow</title>
  <desc>RAG workflow: user query is embedded, compared against vector store for top-k retrieval, assembled into context, passed to LLM, and returned as a structured response.</desc>

  <rect width="760" height="360" fill="#f8f9fa"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Figure 6 — Retrieval-Augmented Generation (RAG) Workflow</text>

  <defs>
    <marker id="ra" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="rb" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <rect x="30" y="130" width="120" height="70" rx="6" fill="#e8f4fd" stroke="#5a9fd4" stroke-width="1.5"/>
  <text x="90" y="158" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a4a6b">User Query</text>
  <text x="90" y="174" text-anchor="middle" font-size="8.5" fill="#3a6a8b">Natural language</text>
  <text x="90" y="187" text-anchor="middle" font-size="8.5" fill="#3a6a8b">question text</text>

  <line x1="150" y1="165" x2="178" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <rect x="178" y="130" width="130" height="70" rx="6" fill="#f3e8ff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="243" y="155" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a1870">Query Embedding</text>
  <text x="243" y="172" text-anchor="middle" font-size="8.5" fill="#6a3090">Python embedding</text>
  <text x="243" y="185" text-anchor="middle" font-size="8.5" fill="#6a3090">service — dense vector</text>

  <line x1="308" y1="165" x2="336" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <rect x="336" y="100" width="130" height="130" rx="6" fill="#fef9e7" stroke="#e2a800" stroke-width="1.5"/>
  <text x="401" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5a3e00">Top-k Retrieval</text>
  <text x="401" y="145" text-anchor="middle" font-size="8.5" fill="#7a5800">Cosine similarity</text>
  <text x="401" y="158" text-anchor="middle" font-size="8.5" fill="#7a5800">against vector store</text>
  <rect x="352" y="170" width="98" height="44" rx="4" fill="#fce" stroke="#e2a800" stroke-width="1"/>
  <text x="401" y="188" text-anchor="middle" font-size="8" font-weight="600" fill="#5a3e00">Vector Store</text>
  <text x="401" y="202" text-anchor="middle" font-size="7.5" fill="#7a5800">chunk–vector pairs</text>

  <line x1="466" y1="165" x2="494" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <rect x="494" y="130" width="130" height="70" rx="6" fill="#e9f5e9" stroke="#4caf76" stroke-width="1.5"/>
  <text x="559" y="155" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b4d2e">Context Assembly</text>
  <text x="559" y="172" text-anchor="middle" font-size="8.5" fill="#2a6a40">Retrieved chunks +</text>
  <text x="559" y="185" text-anchor="middle" font-size="8.5" fill="#2a6a40">system prompt</text>

  <line x1="624" y1="165" x2="652" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ra)"/>

  <rect x="652" y="100" width="95" height="130" rx="6" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="699" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7b1a1a">LLM</text>
  <text x="699" y="145" text-anchor="middle" font-size="8.5" fill="#a03030">Context-grounded</text>
  <text x="699" y="158" text-anchor="middle" font-size="8.5" fill="#a03030">generation</text>
  <text x="699" y="178" text-anchor="middle" font-size="7.5" fill="#a03030">Claude / GPT-4</text>
  <text x="699" y="192" text-anchor="middle" font-size="7.5" fill="#a03030">Anthropic API</text>
  <text x="699" y="206" text-anchor="middle" font-size="7.5" fill="#a03030">via LangChain</text>

  <path d="M699,230 Q699,270 559,270 Q243,270 90,270 Q90,230 90,200" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#rb)"/>
  <text x="380" y="287" text-anchor="middle" font-size="8.5" fill="#e74c3c">Structured response — reply · service · suggestions · nextStepsUrl</text>

  <circle cx="52" cy="134" r="10" fill="#5a9fd4"/>
  <text x="52" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="white">1</text>
  <circle cx="200" cy="134" r="10" fill="#9b59b6"/>
  <text x="200" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="white">2</text>
  <circle cx="358" cy="104" r="10" fill="#e2a800"/>
  <text x="358" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="white">3</text>
  <circle cx="516" cy="134" r="10" fill="#4caf76"/>
  <text x="516" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="white">4</text>
  <circle cx="674" cy="104" r="10" fill="#e74c3c"/>
  <text x="674" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="white">5</text>
</svg>
