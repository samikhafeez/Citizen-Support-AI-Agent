<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Figure 3 — Development Methodology</title>
  <desc>Six iterative stages: Problem Analysis, Design, Implementation, Testing, Deployment, Refinement — arranged left to right with a feedback loop returning from Refinement to Design.</desc>

  <rect width="760" height="300" fill="#f8f9fa"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Figure 3 — Development Methodology</text>

  <rect x="30" y="80" width="105" height="110" rx="6" fill="#e8f4fd" stroke="#5a9fd4" stroke-width="1.5"/>
  <text x="82" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a6b">1. Problem</text>
  <text x="82" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a6b">Analysis</text>
  <text x="82" y="142" text-anchor="middle" font-size="8.5" fill="#3a6a8b">Council service</text>
  <text x="82" y="155" text-anchor="middle" font-size="8.5" fill="#3a6a8b">scope definition</text>
  <text x="82" y="168" text-anchor="middle" font-size="8.5" fill="#3a6a8b">User needs review</text>

  <rect x="153" y="80" width="105" height="110" rx="6" fill="#e9f5e9" stroke="#4caf76" stroke-width="1.5"/>
  <text x="205" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#1b4d2e">2. Design</text>
  <text x="205" y="130" text-anchor="middle" font-size="8.5" fill="#2a6a40">Architecture</text>
  <text x="205" y="143" text-anchor="middle" font-size="8.5" fill="#2a6a40">Intent model</text>
  <text x="205" y="156" text-anchor="middle" font-size="8.5" fill="#2a6a40">Conversation flow</text>
  <text x="205" y="169" text-anchor="middle" font-size="8.5" fill="#2a6a40">Content schema</text>

  <rect x="276" y="80" width="105" height="110" rx="6" fill="#fef9e7" stroke="#e2a800" stroke-width="1.5"/>
  <text x="328" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#5a3e00">3. Implement</text>
  <text x="328" y="130" text-anchor="middle" font-size="8.5" fill="#7a5800">Backend API</text>
  <text x="328" y="143" text-anchor="middle" font-size="8.5" fill="#7a5800">RAG pipeline</text>
  <text x="328" y="156" text-anchor="middle" font-size="8.5" fill="#7a5800">Scrapers</text>
  <text x="328" y="169" text-anchor="middle" font-size="8.5" fill="#7a5800">Chat interface</text>

  <rect x="399" y="80" width="105" height="110" rx="6" fill="#f3e8ff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="451" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#4a1870">4. Testing</text>
  <text x="451" y="130" text-anchor="middle" font-size="8.5" fill="#6a3090">Unit tests</text>
  <text x="451" y="143" text-anchor="middle" font-size="8.5" fill="#6a3090">Integration tests</text>
  <text x="451" y="156" text-anchor="middle" font-size="8.5" fill="#6a3090">Regression suite</text>
  <text x="451" y="169" text-anchor="middle" font-size="8.5" fill="#6a3090">Edge case review</text>

  <rect x="522" y="80" width="105" height="110" rx="6" fill="#fff0e6" stroke="#e07030" stroke-width="1.5"/>
  <text x="574" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#5a2800">5. Deployment</text>
  <text x="574" y="130" text-anchor="middle" font-size="8.5" fill="#7a4010">Docker build</text>
  <text x="574" y="143" text-anchor="middle" font-size="8.5" fill="#7a4010">nginx proxy</text>
  <text x="574" y="156" text-anchor="middle" font-size="8.5" fill="#7a4010">AWS EC2 launch</text>
  <text x="574" y="169" text-anchor="middle" font-size="8.5" fill="#7a4010">HTTPS / TLS</text>

  <rect x="645" y="80" width="105" height="110" rx="6" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="697" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="#7b1a1a">6. Refinement</text>
  <text x="697" y="130" text-anchor="middle" font-size="8.5" fill="#a03030">Log analysis</text>
  <text x="697" y="143" text-anchor="middle" font-size="8.5" fill="#a03030">Feedback review</text>
  <text x="697" y="156" text-anchor="middle" font-size="8.5" fill="#a03030">Prompt tuning</text>
  <text x="697" y="169" text-anchor="middle" font-size="8.5" fill="#a03030">Guard updates</text>

  <defs>
    <marker id="fwd" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="back" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <line x1="135" y1="135" x2="153" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#fwd)"/>
  <line x1="258" y1="135" x2="276" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#fwd)"/>
  <line x1="381" y1="135" x2="399" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#fwd)"/>
  <line x1="504" y1="135" x2="522" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#fwd)"/>
  <line x1="627" y1="135" x2="645" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#fwd)"/>

  <path d="M697,80 Q697,45 451,45 Q205,45 205,80" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#back)"/>
  <text x="451" y="38" text-anchor="middle" font-size="8.5" fill="#e74c3c">Iterative feedback loop</text>
</svg>
