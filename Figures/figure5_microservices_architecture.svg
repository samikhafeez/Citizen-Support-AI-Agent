<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Figure 5 — Microservices Deployment Architecture</title>
  <desc>Deployment diagram showing browser connecting through nginx reverse proxy to .NET backend, Python embedding service, and LangChain AI service — all running in Docker containers on AWS EC2.</desc>

  <rect width="760" height="420" fill="#f8f9fa"/>
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Figure 5 — Microservices Deployment Architecture</text>

  <defs>
    <marker id="m1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="m2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="mint" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>

  <rect x="30" y="160" width="120" height="70" rx="6" fill="#e8f4fd" stroke="#5a9fd4" stroke-width="1.5"/>
  <text x="90" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4a6b">Browser</text>
  <text x="90" y="205" text-anchor="middle" font-size="8.5" fill="#3a6a8b">Citizen web client</text>
  <text x="90" y="218" text-anchor="middle" font-size="8.5" fill="#3a6a8b">HTTPS (port 443)</text>

  <line x1="150" y1="195" x2="188" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="169" y="189" text-anchor="middle" font-size="8" fill="#555">HTTPS</text>

  <rect x="185" y="50" width="545" height="330" rx="10" fill="none" stroke="#e07030" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="457" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#e07030">AWS EC2 Instance</text>

  <rect x="200" y="155" width="130" height="80" rx="6" fill="#fff0e6" stroke="#e07030" stroke-width="1.5"/>
  <text x="265" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#5a2800">nginx</text>
  <text x="265" y="196" text-anchor="middle" font-size="8.5" fill="#7a4010">Reverse proxy</text>
  <text x="265" y="209" text-anchor="middle" font-size="8.5" fill="#7a4010">TLS termination</text>
  <text x="265" y="222" text-anchor="middle" font-size="8.5" fill="#7a4010">Static file serving</text>

  <rect x="345" y="90" width="365" height="265" rx="8" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="527" y="108" text-anchor="middle" font-size="9" font-weight="600" fill="#9b59b6">Docker Internal Network</text>

  <rect x="360" y="120" width="155" height="95" rx="6" fill="#e9f5e9" stroke="#4caf76" stroke-width="1.5"/>
  <text x="437" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#1b4d2e">.NET Backend</text>
  <text x="437" y="162" text-anchor="middle" font-size="8.5" fill="#2a6a40">ASP.NET Core (.NET 10)</text>
  <text x="437" y="175" text-anchor="middle" font-size="8.5" fill="#2a6a40">ChatOrchestrator</text>
  <text x="437" y="188" text-anchor="middle" font-size="8.5" fill="#2a6a40">ChatController · Logging</text>
  <text x="437" y="201" text-anchor="middle" font-size="8.5" fill="#2a6a40">Port 5000 (internal)</text>

  <rect x="540" y="120" width="155" height="95" rx="6" fill="#f3e8ff" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="617" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#4a1870">Embedding Service</text>
  <text x="617" y="160" text-anchor="middle" font-size="8.5" fill="#6a3090">Python (FastAPI)</text>
  <text x="617" y="173" text-anchor="middle" font-size="8.5" fill="#6a3090">Sentence-transformers</text>
  <text x="617" y="186" text-anchor="middle" font-size="8.5" fill="#6a3090">Vector similarity search</text>
  <text x="617" y="199" text-anchor="middle" font-size="8.5" fill="#6a3090">Port 8001 (internal)</text>

  <rect x="360" y="240" width="155" height="95" rx="6" fill="#fce4e4" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="437" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#7b1a1a">LangChain / AI Service</text>
  <text x="437" y="280" text-anchor="middle" font-size="8.5" fill="#a03030">Python (LangChain)</text>
  <text x="437" y="293" text-anchor="middle" font-size="8.5" fill="#a03030">RAG orchestration</text>
  <text x="437" y="306" text-anchor="middle" font-size="8.5" fill="#a03030">LLM API calls</text>
  <text x="437" y="319" text-anchor="middle" font-size="8.5" fill="#a03030">Port 8000 (internal)</text>

  <rect x="540" y="240" width="155" height="95" rx="6" fill="#fef9e7" stroke="#e2a800" stroke-width="1.5"/>
  <text x="617" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#5a3e00">Shared Volume</text>
  <text x="617" y="280" text-anchor="middle" font-size="8.5" fill="#7a5800">Vector cache files</text>
  <text x="617" y="293" text-anchor="middle" font-size="8.5" fill="#7a5800">JSONL chat logs</text>
  <text x="617" y="306" text-anchor="middle" font-size="8.5" fill="#7a5800">Feedback logs</text>
  <text x="617" y="319" text-anchor="middle" font-size="8.5" fill="#7a5800">Docker bind mount</text>

  <line x1="330" y1="195" x2="360" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="341" y="186" text-anchor="middle" font-size="7.5" fill="#555">proxy</text>

  <line x1="515" y1="165" x2="540" y2="165" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#mint)"/>
  <text x="527" y="158" text-anchor="middle" font-size="7.5" fill="#9b59b6">embed</text>

  <line x1="437" y1="215" x2="437" y2="240" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#m2)"/>
  <text x="450" y="233" font-size="7.5" fill="#e74c3c">RAG</text>

  <line x1="515" y1="287" x2="540" y2="287" stroke="#e2a800" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#m1)"/>
  <line x1="617" y1="215" x2="617" y2="240" stroke="#e2a800" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#m1)"/>

  <line x1="195" y1="375" x2="225" y2="375" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="379" font-size="8" fill="#555">HTTP proxy</text>
  <line x1="295" y1="375" x2="325" y2="375" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="330" y="379" font-size="8" fill="#9b59b6">Internal API call</text>
  <line x1="425" y1="375" x2="455" y2="375" stroke="#e2a800" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="460" y="379" font-size="8" fill="#888">Shared volume access</text>
  <rect x="560" y="368" width="10" height="10" fill="none" stroke="#9b59b6" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="576" y="378" font-size="8" fill="#9b59b6">Docker network boundary</text>
</svg>
